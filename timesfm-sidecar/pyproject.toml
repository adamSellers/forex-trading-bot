[project]
name = "timesfm-sidecar"
version = "0.1.0"
description = "FastAPI sidecar for serving Google TimesFM forecasts to the forex trading bot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.116",
    "numpy>=2.1,<3",
    "pydantic>=2.10,<3",
    "torch>=2.6,<3",
    "timesfm @ git+https://github.com/google-research/timesfm.git",
    "uvicorn>=0.34,<0.35",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<0.29",
    "pytest>=8.3,<9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
