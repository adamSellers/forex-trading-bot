# Fixed Nginx Configuration for img.oakroad
# File: /etc/nginx/sites-available/forex-trading-bot

# This map block is essential for correctly handling the WebSocket upgrade protocol.
# It dynamically sets the 'Connection' header based on the 'Upgrade' header.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Define the upstream backend server where your Node.js app runs
upstream backend {
    server 127.0.0.1:3101; # Forex backend
    keepalive 32; # Keep connections alive for better performance
}

server {
    listen 80;
    listen 443 ssl http2; # Listen on both HTTP and HTTPS

    # Using hostname and domain only (local DNS configured)
    server_name localhost img img.oakroad;

    # SSL Configuration (ensure these paths are correct on your Pi)
    ssl_certificate /opt/forex-trading-bot/ssl/cert.pem;
    ssl_certificate_key /opt/forex-trading-bot/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Frontend Static Files
    location / {
        root /opt/forex-trading-bot/frontend/dist; # Path to your built React app
        index index.html;
        try_files $uri $uri/ /index.html; # Essential for React Router (SPA)

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }

    # General API Proxy - handles all /api/* routes
    location /api/ {
        proxy_pass http://backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade; # Pass the Upgrade header
        proxy_set_header Connection $connection_upgrade; # Use the mapped Connection header
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Security
        proxy_hide_header X-Powered-By;

        # Timeouts
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Socket.io Proxy - specifically for WebSocket connections
    location /socket.io/ {
        proxy_pass http://backend/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade; # Pass the Upgrade header
        proxy_set_header Connection $connection_upgrade; # Use the mapped Connection header
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeouts
        proxy_connect_timeout 7s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health Check Endpoint (direct access)
    location /health {
        proxy_pass http://backend/api/health;
        access_log off;

        # Quick health check timeouts
        proxy_connect_timeout 2s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;

        # Add health check headers
        add_header X-Health-Check "nginx-proxy" always;
    }

    # System Information Endpoint (direct access)
    location /system {
        proxy_pass http://backend/api/system/health;
        access_log off;

        # Quick system check timeouts
        proxy_connect_timeout 2s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    # Block access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ \.(env|config|key|pem)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block access to source code files (security)
    location ~ \.(sql|md|txt|log)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
